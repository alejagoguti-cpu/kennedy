const slides=[{"group":"APERTURA","title":"Kennedy en red.","body":"Una federación policéntrica para transformar las relaciones entre alimento, agua, movilidad y comunidad.","type":"cover"},{"group":"APERTURA","title":"Una pregunta territorial.","body":"¿Cómo distribuir la capacidad de decidir sin crear otro centro obligatorio?","type":"statement"},{"group":"APERTURA","title":"Índice.","body":"01 Territorio · 02 Diagnóstico · 03 Visión · 04 Sostenimiento · 05 Estructuras · 06 Arquitectura · 07 Simulación","type":"index"},{"group":"APERTURA","title":"Quiénes somos.","body":"Equipo de investigación y diseño territorial. Arquitectura, lectura socioecológica y modelamiento como herramientas para formular hipótesis verificables.","type":"people"},{"group":"APERTURA","title":"Nuestra postura.","body":"No diseñamos un objeto aislado. Diseñamos condiciones espaciales para acuerdos, intercambios y cuidado.","type":"statement"},{"group":"APERTURA","title":"Cómo leer esta propuesta.","body":"Hechos documentados, inferencias territoriales y decisiones proyectuales se presentan como capas diferentes.","type":"three"},{"group":"TERRITORIO","title":"Kennedy no es una isla.","body":"El abastecimiento, los humedales y las rutas de movilidad conectan el barrio con sistemas metropolitanos.","type":"map"},{"group":"TERRITORIO","title":"El territorio cotidiano.","body":"Una compra, un desplazamiento y una lluvia hacen visibles redes que normalmente no aparecen juntas.","type":"three"},{"group":"TERRITORIO","title":"Alimentos.","body":"Productores, transportadores, comerciantes y hogares forman una cadena con capacidades desiguales para decidir.","type":"flow"},{"group":"TERRITORIO","title":"Agua.","body":"El Burro, La Vaca y Techo no son vacíos: forman parte de una red ecológica presionada por la urbanización.","type":"map"},{"group":"TERRITORIO","title":"Movilidad.","body":"Banderas, las Américas y la avenida Ciudad de Cali concentran transferencias y desplazamientos.","type":"flow"},{"group":"TERRITORIO","title":"Espacio público.","body":"Circulación, comercio, encuentro y permanencia compiten por superficies limitadas.","type":"three"},{"group":"TERRITORIO","title":"Cuatro presiones.","body":"Abastecimiento · movilidad · agua y hábitat · espacio público.","type":"four"},{"group":"TERRITORIO","title":"Una concentración visible.","body":"Corabastos es una infraestructura esencial del abastecimiento. La propuesta no busca sustituirla.","type":"statement"},{"group":"TERRITORIO","title":"La pregunta no es cerrar.","body":"La pregunta es qué circuitos complementarios pueden ampliar opciones sin desconocer las redes existentes.","type":"flow"},{"group":"TERRITORIO","title":"Del síntoma a la relación.","body":"Una presión no se explica por una sola causa. La lectura conecta actores, recursos y decisiones.","type":"network"},{"group":"VISIÓN","title":"Overview.","body":"Federación policéntrica: varios nodos con autonomía relativa y reglas de cooperación.","type":"cover"},{"group":"VISIÓN","title":"De un centro a una red.","body":"La federación agrega posibilidades de intercambio; no reemplaza el sistema de abastecimiento existente.","type":"network"},{"group":"VISIÓN","title":"¿Qué es un nodo?","body":"Un lugar, actor o infraestructura capaz de recibir, transformar o distribuir recursos y decisiones.","type":"three"},{"group":"VISIÓN","title":"¿Qué es un vínculo?","body":"Un acuerdo verificable de intercambio, cuidado, información o corresponsabilidad.","type":"flow"},{"group":"VISIÓN","title":"Una hipótesis espacial.","body":"Espacios pequeños y conectados pueden fortalecer circuitos territoriales complementarios.","type":"map"},{"group":"VISIÓN","title":"Quién interviene.","body":"Hogares, comerciantes, productores, colegios, organizaciones comunitarias e instituciones.","type":"people"},{"group":"VISIÓN","title":"Cómo se construye.","body":"Convocar → escuchar → mapear → acordar → prototipar → simular → diseñar → construir.","type":"timeline"},{"group":"VISIÓN","title":"Qué produce.","body":"Acuerdos, rutas alternativas, espacios de encuentro y mecanismos de seguimiento.","type":"four"},{"group":"SOSTENIMIENTO","title":"Más allá de la inauguración.","body":"La permanencia depende de operación, mantenimiento, recursos y capacidad de adaptación.","type":"cover"},{"group":"SOSTENIMIENTO","title":"Gobernanza distribuida.","body":"Cada nodo necesita responsabilidades explícitas y mecanismos para resolver desacuerdos.","type":"network"},{"group":"SOSTENIMIENTO","title":"Quién convoca.","body":"La convocatoria es una tarea concreta: identificar participantes, canales y tiempos.","type":"people"},{"group":"SOSTENIMIENTO","title":"Quién decide.","body":"Las decisiones requieren criterios, representación y registro de acuerdos.","type":"three"},{"group":"SOSTENIMIENTO","title":"Quién opera.","body":"La operación cotidiana debe distinguirse de la participación ocasional.","type":"three"},{"group":"SOSTENIMIENTO","title":"Quién mantiene.","body":"Limpieza, reparación, reposición y cuidado ecológico necesitan responsables y recursos.","type":"four"},{"group":"SOSTENIMIENTO","title":"De dónde salen los recursos.","body":"Explorar aportes institucionales, economías de intercambio y acuerdos locales; aún sin presupuesto validado.","type":"flow"},{"group":"SOSTENIMIENTO","title":"Cómo se distribuyen.","body":"Evitar que una sola organización concentre recursos y capacidad de veto.","type":"network"},{"group":"SOSTENIMIENTO","title":"Cómo se aprende.","body":"Registrar fallas, ajustar reglas y transferir conocimiento entre nodos.","type":"timeline"},{"group":"SOSTENIMIENTO","title":"Si un nodo falla.","body":"La red debe contar con rutas complementarias y protocolos de contingencia.","type":"network"},{"group":"SOSTENIMIENTO","title":"Indicadores para revisar.","body":"Participación efectiva · continuidad operativa · flujos · recuperación · efectos ambientales.","type":"four"},{"group":"SOSTENIMIENTO","title":"Una condición de viabilidad.","body":"Sin acuerdos verificables y recursos de mantenimiento, la federación sigue siendo una hipótesis.","type":"statement"},{"group":"CUATRO ESTRUCTURAS","title":"Cuatro estructuras.","body":"Producción · distribución · consumo · recuperación de recursos.","type":"cover"},{"group":"CUATRO ESTRUCTURAS","title":"01 / Producción.","body":"Articular capacidades locales de cultivo, aprendizaje y abastecimiento complementario.","type":"structure"},{"group":"CUATRO ESTRUCTURAS","title":"Producir no es solo cultivar.","body":"Requiere suelo, agua, conocimiento, calendario, coordinación y cuidado.","type":"flow"},{"group":"CUATRO ESTRUCTURAS","title":"Dónde podría ocurrir.","body":"Huertas escolares y comunitarias: ubicaciones por validar con actores y condiciones del lugar.","type":"map"},{"group":"CUATRO ESTRUCTURAS","title":"02 / Distribución.","body":"Conectar productores, puntos de intercambio y necesidades de proximidad.","type":"structure"},{"group":"CUATRO ESTRUCTURAS","title":"Mover sin reconcentrar.","body":"Las rutas y horarios deben responder a capacidades reales y no crear otro cuello de botella.","type":"flow"},{"group":"CUATRO ESTRUCTURAS","title":"Puntos de intercambio.","body":"Espacios ligeros para recibir, clasificar y redistribuir; sin imponer un nodo central.","type":"map"},{"group":"CUATRO ESTRUCTURAS","title":"03 / Consumo.","body":"Vincular hogares, comedores, escuelas y comercio de barrio con circuitos de acceso.","type":"structure"},{"group":"CUATRO ESTRUCTURAS","title":"Consumir también decide.","body":"La demanda, los hábitos y los acuerdos de compra modifican el funcionamiento de la red.","type":"flow"},{"group":"CUATRO ESTRUCTURAS","title":"Aprender en común.","body":"La educación alimentaria puede vincular conocimiento, preparación y decisiones colectivas.","type":"people"},{"group":"CUATRO ESTRUCTURAS","title":"04 / Recuperación.","body":"Convertir pérdidas y residuos orgánicos en flujos de aprovechamiento donde sea viable.","type":"structure"},{"group":"CUATRO ESTRUCTURAS","title":"Del residuo al recurso.","body":"Separación → recolección → tratamiento adecuado → posible retorno al sistema.","type":"flow"},{"group":"CUATRO ESTRUCTURAS","title":"Límites ambientales.","body":"La recuperación requiere condiciones sanitarias, operación responsable y revisión técnica.","type":"statement"},{"group":"CUATRO ESTRUCTURAS","title":"Las cuatro se conectan.","body":"Ninguna estructura funciona de forma aislada: materiales, decisiones y cuidados circulan.","type":"network"},{"group":"ARQUITECTURA Y SIMULACIÓN","title":"Arquitectura como interfaz.","body":"Cinco espacios posibles articulan actores, flujos y decisiones territoriales.","type":"cover"},{"group":"ARQUITECTURA Y SIMULACIÓN","title":"E01 / Intercambio barrial.","body":"Recepción, encuentro y circulación de productos a escala de proximidad.","type":"structure"},{"group":"ARQUITECTURA Y SIMULACIÓN","title":"E02 / Aula alimentaria.","body":"Aprendizaje, preparación y experimentación con prácticas de alimentación.","type":"structure"},{"group":"ARQUITECTURA Y SIMULACIÓN","title":"E03 / Recuperación orgánica.","body":"Infraestructura para clasificación y aprovechamiento, sujeta a viabilidad técnica.","type":"structure"},{"group":"ARQUITECTURA Y SIMULACIÓN","title":"E04 / Asamblea.","body":"Espacio para deliberar, acordar, registrar y revisar decisiones.","type":"structure"},{"group":"ARQUITECTURA Y SIMULACIÓN","title":"E05 / Observación ecológica.","body":"Lugar para aprender del humedal sin tratarlo como superficie disponible para construir.","type":"structure"},{"group":"ARQUITECTURA Y SIMULACIÓN","title":"Simular antes de afirmar.","body":"Comparar escenarios ayuda a explorar efectos, no a demostrar automáticamente resultados.","type":"network"},{"group":"ARQUITECTURA Y SIMULACIÓN","title":"Cuatro escenarios.","body":"S0 base · S1 circuitos barriales · S2 falla de abastecimiento · S3 restricciones ecológicas.","type":"four"},{"group":"ARQUITECTURA Y SIMULACIÓN","title":"Qué sigue.","body":"Contrastar actores, validar localizaciones, modelar flujos y definir responsabilidades.","type":"timeline"},{"group":"ARQUITECTURA Y SIMULACIÓN","title":"Kennedy en red.","body":"La forma sigue a las relaciones. La propuesta se sostiene cuando sus acuerdos también lo hacen.","type":"end"}];

const color=pal[index%4],variant=index%10;
const circle=(x,y,r,c=color,layer='layer-a')=>'<circle class="hotspot '+layer+'" tabindex="0" role="button" aria-label="Explorar elemento" cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'" stroke="#263a33" stroke-width="2"/>';
const box=(x,y,w,h,c=color,layer='layer-b')=>'<rect class="hotspot '+layer+'" tabindex="0" role="button" aria-label="Explorar elemento" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(variant%3===0?80:6)+'" fill="'+c+'" stroke="#263a33" stroke-width="2"/>';
const path=(d)=>'<path class="anim layer-c" d="'+d+'" fill="none" stroke="'+color+'" stroke-width="4" stroke-linecap="round"/>';
const text=(x,y,t,size=16)=>'<text x="'+x+'" y="'+y+'" font-family="Space Grotesk" font-size="'+size+'" font-weight="700" fill="#263a33">'+t+'</text>';
let a='';
if(type==='network'||type==='map'){const n=6+variant%4,pts=Array.from({length:n},(_,j)=>[290+Math.cos(j*Math.PI*2/n+index*.18)*(135+variant*7),210+Math.sin(j*Math.PI*2/n+index*.18)*145]);a=pts.map(([x,y],j)=>path('M290 210 L'+x+' '+y)+(j?path('M'+pts[j-1][0]+' '+pts[j-1][1]+' L'+x+' '+y):'')).join('')+pts.map(([x,y],j)=>circle(x,y,15+(j%3)*8,j%2?'#f7f5ef':color,j%2?'layer-a':'layer-b')).join('')+circle(290,210,45,'#f4d887')+text(267,216,'RED',19)}
else if(type==='flow'||type==='timeline'){const n=3+variant%3,w=490/n;a=Array.from({length:n},(_,j)=>box(30+j*w,110+(j%2)*65,w-22,130,j%2?'#f7f5ef':color)+text(43+j*w,165+(j%2)*65,String(j+1).padStart(2,'0'),30)+(j?path('M'+(12+j*w)+' 220 L'+(30+j*w)+' 220'):'' )).join('')}
else if(type==='four'||type==='index'){a=Array.from({length:4},(_,j)=>box(40+(j%2)*250,35+Math.floor(j/2)*195,220,175,['#a73e49','#2e5b60','#e0a83c','#50684e'][j])+text(64+(j%2)*250,95+Math.floor(j/2)*195,'0'+(j+1),36)).join('')}
else if(type==='people'){a=Array.from({length:5+variant%3},(_,j)=>circle(60+j*75,125+(j%2)*36,24,j%2?'#f7f5ef':color)+box(33+j*75,170+(j%2)*36,55,115,j%2?'#e0a83c':'#2e5b60')).join('')}
else if(type==='three'){a=[0,1,2].map((j)=>circle(100+j*190,190+(j%2)*35,62,['#a73e49','#2e5b60','#d18c49'][j])+text(73+j*190,203+(j%2)*35,'0'+(j+1),32)).join('')+path('M155 190 Q290 20 420 215')}
else if(type==='structure'){a=path('M60 340 L280 70 L510 340 Z')+Array.from({length:4+variant%3},(_,j)=>box(80+j*76,230-(j%2)*30,60,110,j%2?'#f7f5ef':color)).join('')+box(130,105,300,55,'#f4d887')}
else if(type==='statement'){a=Array.from({length:3+variant%4},(_,j)=>circle(290,210,175-j*29,j%2?'#f7f5ef':color)).join('')}
else{a=Array.from({length:5+variant%5},(_,j)=>circle(290+Math.cos(j*2.4)*j*21,210+Math.sin(j*2.4)*j*19,18+j*5,j%2?'#f7f5ef':color)).join('')+path('M30 380 Q280 30 550 380')}
return '<svg viewBox="0 0 580 420" role="group" aria-label="Diagrama interactivo: selecciona un elemento o activa los controles">'+a+'</svg>';
}

const washes=['#efb9bb','#f4d887','#b6c8dd','#c6d5b6','#e8c8a6','#c9b7d5','#b9d7d1','#e6b7aa','#d5d5ad','#bed1ea'];
$('viewport').innerHTML=slides.map((slide,i)=>'<section class="slide layout-'+(i%12)+' '+slide.type+'" id="slide-'+(i+1)+'" data-phase="0" style="--wash:'+washes[i%10]+';--accent:'+pal[i%4]+'" aria-label="Diapositiva '+(i+1)+': '+slide.title.replace(/"/g,'&quot;')+'"><div class="copy"><div class="eyebrow">'+slide.group+' / FEDERACIÓN POLICÉNTRICA</div><div><h1>'+slide.title+'</h1><p>'+slide.body+'</p></div><div class="num">'+String(i+1).padStart(2,'0')+' / 60 &nbsp; KENNEDY · BOGOTÁ</div></div><div class="visual">'+art(slide.type,i)+'<div class="motion-toolbar"><button class="motion-action" data-action="advance" aria-label="Avanzar animación">▶ EXPLORAR</button><button class="motion-action" data-action="reset" aria-label="Reiniciar animación">↺</button><span class="motion-state" aria-live="polite">01 · OBSERVAR LA RELACIÓN</span></div></div></section>').join('');
const phaseLabels=['01 · OBSERVAR LA RELACIÓN','02 · EXPLORAR LOS VÍNCULOS','03 · RECONFIGURAR EL SISTEMA'];
function setPhase(section,n){const phase=((n%3)+3)%3;section.dataset.phase=String(phase);section.querySelector('.motion-state').textContent=phaseLabels[phase];section.querySelectorAll('.hotspot').forEach((el,i)=>el.classList.toggle('selected',i%3===phase));}
$('viewport').addEventListener('click',e=>{const section=e.target.closest('.slide');if(!section)return;const action=e.target.closest('[data-action]');if(action){setPhase(section,action.dataset.action==='reset'?0:Number(section.dataset.phase)+1);return}if(e.target.closest('.hotspot'))setPhase(section,Number(section.dataset.phase)+1)});
$('viewport').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('hotspot')){e.preventDefault();setPhase(e.target.closest('.slide'),Number(e.target.closest('.slide').dataset.phase)+1)}});

let current=0,overview=false;
function go(i){current=Math.max(0,Math.min(slides.length-1,i));document.querySelectorAll('.slide').forEach((el,j)=>{el.classList.toggle('active',j===current);el.setAttribute('aria-hidden',j!==current)});$('counter').textContent=String(current+1).padStart(2,'0')+' / 60';$('progress').style.width=((current+1)/60*100)+'%';$('prev').disabled=current===0;$('next').disabled=current===59;document.querySelectorAll('.chapter-button').forEach(b=>b.classList.toggle('selected',b.dataset.group===slides[current].group));history.replaceState(null,'','#slide-'+(current+1))}
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);
const starts=[];slides.forEach((s,i)=>{if(!starts.some(x=>x.group===s.group))starts.push({group:s.group,i})});
$('chapters').innerHTML=starts.map(x=>'<button class="chapter-button" data-group="'+x.group+'" data-index="'+x.i+'">'+x.group+'</button>').join('');
document.querySelectorAll('.chapter-button').forEach(b=>b.onclick=()=>go(+b.dataset.index));
$('overviewGrid').innerHTML=slides.map((s,i)=>'<button data-i="'+i+'"><small>'+String(i+1).padStart(2,'0')+' · '+s.group+'</small><strong>'+s.title+'</strong></button>').join('');
$('overviewGrid').onclick=e=>{const b=e.target.closest('button[data-i]');if(b){toggleOverview(false);go(+b.dataset.i)}};
function toggleOverview(force){overview=typeof force==='boolean'?force:!overview;$('overview').classList.toggle('open',overview);$('openOverview').textContent=overview?'CERRAR ÍNDICE':'ÍNDICE · 60'}
$('openOverview').onclick=()=>toggleOverview();
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key.toLowerCase()==='i'){toggleOverview();return}if(e.key==='Escape'&&overview){toggleOverview(false);return}if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();return}if(overview)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});
let sx=0;$('viewport').addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});$('viewport').addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-sx;if(Math.abs(dx)>70)go(current+(dx<0?1:-1))},{passive:true});
const hash=Number((location.hash.match(/slide-(\d+)/)||[])[1]);go(hash>0?hash-1:0);
</script></body></html>

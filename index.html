/* 60 differentiated kinetic compositions */
.slide{--accent:#a73e49;--wash:#efb9bb;--tilt:0deg}
.slide .visual{background:var(--wash)!important}
.slide .copy{transition:background .5s,color .5s}
.slide .visual svg{transition:transform .7s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 12px 0 #0000000b)}
.slide .visual .hotspot{cursor:pointer;transition:filter .2s,opacity .2s;outline:none}
.slide .visual .hotspot:hover,.slide .visual .hotspot:focus{filter:brightness(1.3) drop-shadow(0 0 7px #ffffffbb)}
.slide .visual .hotspot.selected{filter:drop-shadow(0 0 12px #fff)}
.slide .motion-toolbar{position:absolute;bottom:28px;left:28px;right:28px;display:flex;align-items:center;gap:9px;z-index:2;flex-wrap:wrap}

.slide[data-phase="1"] .layer-a{transform:translate(24px,-12px)}
.slide[data-phase="1"] .layer-b{transform:translate(-18px,18px)}
.slide[data-phase="2"] .layer-a{transform:translate(-26px,18px) scale(.9)}
.slide[data-phase="2"] .layer-b{transform:translate(18px,-20px) scale(1.12)}
.slide[data-phase="2"] .layer-c{transform:rotate(8deg)}
.slide.active .visual svg{animation:kineticIn .8s both}

const pal=['#a73e49','#2e5b60','#ad5c34','#425b47'];
function art(type,index){
const color=pal[index%4],variant=index%10;
const circle=(x,y,r,c=color,layer='layer-a')=>'<circle class="hotspot '+layer+'" tabindex="0" role="button" aria-label="Explorar elemento" cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'" stroke="#263a33" stroke-width="2"/>';
const box=(x,y,w,h,c=color,layer='layer-b')=>'<rect class="hotspot '+layer+'" tabindex="0" role="button" aria-label="Explorar elemento" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(variant%3===0?80:6)+'" fill="'+c+'" stroke="#263a33" stroke-width="2"/>';
const path=(d)=>'<path class="anim layer-c" d="'+d+'" fill="none" stroke="'+color+'" stroke-width="4" stroke-linecap="round"/>';
const text=(x,y,t,size=16)=>'<text x="'+x+'" y="'+y+'" font-family="Space Grotesk" font-size="'+size+'" font-weight="700" fill="#263a33">'+t+'</text>';
let a='';
if(type==='network'||type==='map'){const n=6+variant%4,pts=Array.from({length:n},(_,j)=>[290+Math.cos(j*Math.PI*2/n+index*.18)*(135+variant*7),210+Math.sin(j*Math.PI*2/n+index*.18)*145]);a=pts.map(([x,y],j)=>path('M290 210 L'+x+' '+y)+(j?path('M'+pts[j-1][0]+' '+pts[j-1][1]+' L'+x+' '+y):'')).join('')+pts.map(([x,y],j)=>circle(x,y,15+(j%3)*8,j%2?'#f7f5ef':color,j%2?'layer-a':'layer-b')).join('')+circle(290,210,45,'#f4d887')+text(267,216,'RED',19)}
else if(type==='flow'||type==='timeline'){const n=3+variant%3,w=490/n;a=Array.from({length:n},(_,j)=>box(30+j*w,110+(j%2)*65,w-22,130,j%2?'#f7f5ef':color)+text(43+j*w,165+(j%2)*65,String(j+1).padStart(2,'0'),30)+(j?path('M'+(12+j*w)+' 220 L'+(30+j*w)+' 220'):'' )).join('')}
else if(type==='four'||type==='index'){a=Array.from({length:4},(_,j)=>box(40+(j%2)*250,35+Math.floor(j/2)*195,220,175,['#a73e49','#2e5b60','#e0a83c','#50684e'][j])+text(64+(j%2)*250,95+Math.floor(j/2)*195,'0'+(j+1),36)).join('')}
else if(type==='people'){a=Array.from({length:5+variant%3},(_,j)=>circle(60+j*75,125+(j%2)*36,24,j%2?'#f7f5ef':color)+box(33+j*75,170+(j%2)*36,55,115,j%2?'#e0a83c':'#2e5b60')).join('')}
else if(type==='three'){a=[0,1,2].map((j)=>circle(100+j*190,190+(j%2)*35,62,['#a73e49','#2e5b60','#d18c49'][j])+text(73+j*190,203+(j%2)*35,'0'+(j+1),32)).join('')+path('M155 190 Q290 20 420 215')}
else if(type==='structure'){a=path('M60 340 L280 70 L510 340 Z')+Array.from({length:4+variant%3},(_,j)=>box(80+j*76,230-(j%2)*30,60,110,j%2?'#f7f5ef':color)).join('')+box(130,105,300,55,'#f4d887')}
else if(type==='statement'){a=Array.from({length:3+variant%4},(_,j)=>circle(290,210,175-j*29,j%2?'#f7f5ef':color)).join('')}
else{a=Array.from({length:5+variant%5},(_,j)=>circle(290+Math.cos(j*2.4)*j*21,210+Math.sin(j*2.4)*j*19,18+j*5,j%2?'#f7f5ef':color)).join('')+path('M30 380 Q280 30 550 380')}
return '<svg viewBox="0 0 580 420" role="group" aria-label="Diagrama interactivo: selecciona un elemento o activa los controles">'+a+'</svg>';
}

function mapMarkup(n){const c=mapConfigs[n];const lat=c.center[0],lon=c.center[1];const span=n===17||n===34?0.012:0.033;const bbox=[lon-span,lat-span*.65,lon+span,lat+span*.65].join('%2C');const url='https://www.openstreetmap.org/export/embed.html?bbox='+bbox+'&layer=mapnik&marker='+lat+'%2C'+lon;return '<div class="territory-map real-map-embed" data-map-slide="'+n+'"><iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Mapa real de Kennedy, OpenStreetMap" src="'+url+'" allowfullscreen></iframe><div class="map-status">MAPA REAL · KENNEDY, BOGOTÁ<br>DESPLAZA Y ACERCA PARA EXPLORAR</div><a class="map-source" href="https://www.openstreetmap.org/#map=13/'+lat+'/'+lon+'" target="_blank" rel="noopener">ABRIR MAPA COMPLETO ↗</a><div class="map-credit">© OpenStreetMap contributors</div></div>'}
const mapState=new Map();
function project(lat,lon,z){const scale=256*Math.pow(2,z),rad=lat*Math.PI/180;return [(lon+180)/360*scale,(1-Math.log(Math.tan(rad)+1/Math.cos(rad))/Math.PI)/2*scale]}
function unproject(x,y,z){const scale=256*Math.pow(2,z),lon=x/scale*360-180,n=Math.PI-2*Math.PI*y/scale;return [Math.atan(Math.sinh(n))*180/Math.PI,lon]}
function initTerritoryMap(n){const host=document.querySelector('[data-map-slide="'+n+'"]');if(!host||mapState.has(n))return;const c=mapConfigs[n],state={center:c.center.slice(),zoom:c.zoom};mapState.set(n,state);const tiles=host.querySelector('.map-tiles'),overlay=host.querySelector('.map-overlay');
function render(){const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;const [cx,cy]=project(...state.center,state.zoom),minX=Math.floor((cx-w/2)/256),maxX=Math.floor((cx+w/2)/256),minY=Math.floor((cy-h/2)/256),maxY=Math.floor((cy+h/2)/256),limit=2**state.zoom;tiles.innerHTML='';for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++){if(y<0||y>=limit)continue;const im=document.createElement('img');im.className='tile';im.alt='';im.loading='lazy';im.referrerPolicy='strict-origin-when-cross-origin';im.src='https://tile.openstreetmap.org/'+state.zoom+'/'+((x%limit+limit)%limit)+'/'+y+'.png';im.style.left=(x*256-cx+w/2)+'px';im.style.top=(y*256-cy+h/2)+'px';tiles.appendChild(im)}overlay.innerHTML='';(c.points||[]).forEach(p=>{const [px,py]=project(p[1],p[2],state.zoom),left=px-cx+w/2,top=py-cy+h/2;const pin=document.createElement('div');pin.className='map-pin';pin.style.left=left+'px';pin.style.top=top+'px';overlay.appendChild(pin);const label=document.createElement('div');label.className='map-label';label.textContent=p[0];label.style.left=left+'px';label.style.top=(top-12)+'px';overlay.appendChild(label)})}
state.render=render;render();let drag=null;tiles.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,c:project(...state.center,state.zoom)};tiles.setPointerCapture(e.pointerId)});tiles.addEventListener('pointermove',e=>{if(!drag)return;state.center=unproject(drag.c[0]-(e.clientX-drag.x),drag.c[1]-(e.clientY-drag.y),state.zoom);render()});tiles.addEventListener('pointerup',()=>drag=null);tiles.addEventListener('pointercancel',()=>drag=null);host.querySelectorAll('[data-mapzoom]').forEach(b=>b.addEventListener('click',()=>{state.zoom=Math.max(10,Math.min(18,state.zoom+Number(b.dataset.mapzoom)));render()}));host.addEventListener('wheel',e=>{e.preventDefault();state.zoom=Math.max(10,Math.min(18,state.zoom+(e.deltaY<0?1:-1)));render()},{passive:false});window.addEventListener('resize',render)}
const washes=['#efb9bb','#f4d887','#b6c8dd','#c6d5b6','#e8c8a6','#c9b7d5','#b9d7d1','#e6b7aa','#d5d5ad','#bed1ea'];

function setPhase(section,n){const phase=((n%3)+3)%3;section.dataset.phase=String(phase);section.querySelector('.motion-state').textContent=phaseLabels[phase];section.querySelectorAll('.hotspot').forEach((el,i)=>el.classList.toggle('selected',i%3===phase));}
$('viewport').addEventListener('click',e=>{const section=e.target.closest('.slide');if(!section)return;const action=e.target.closest('[data-action]');if(action){setPhase(section,action.dataset.action==='reset'?0:Number(section.dataset.phase)+1);return}if(e.target.closest('.hotspot'))setPhase(section,Number(section.dataset.phase)+1)});
$('viewport').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('hotspot')){e.preventDefault();setPhase(e.target.closest('.slide'),Number(e.target.closest('.slide').dataset.phase)+1)}});

const side=$('deckSideList');let lastGroup='';side.innerHTML=slides.map((sl,i)=>{let heading='';if(sl.group!==lastGroup){lastGroup=sl.group;heading='<div class="deck-group">'+sl.group+'</div>'}return heading+'<button data-index="'+i+'"><span class="n">'+String(i+1).padStart(2,'0')+'</span><span>'+sl.title+'</span></button>'}).join('');side.addEventListener('click',e=>{const b=e.target.closest('button[data-index]');if(b)go(Number(b.dataset.index))});
let current=0,overview=false;
function go(i){current=Math.max(0,Math.min(slides.length-1,i));document.querySelectorAll('.slide').forEach((el,j)=>{el.classList.toggle('active',j===current);el.setAttribute('aria-hidden',j!==current)});$('counter').textContent=String(current+1).padStart(2,'0')+' / 60';$('progress').style.width=((current+1)/60*100)+'%';$('prev').disabled=current===0;$('next').disabled=current===59;document.querySelectorAll('.chapter-button').forEach(b=>b.classList.toggle('selected',b.dataset.group===slides[current].group));side.querySelectorAll('button[data-index]').forEach(b=>b.classList.toggle('on',Number(b.dataset.index)===current));side.querySelector('button.on')?.scrollIntoView({block:'nearest'});history.replaceState(null,'','#slide-'+(current+1))}
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);

function toggleOverview(force){overview=typeof force==='boolean'?force:!overview;$('overview').classList.toggle('open',overview);$('openOverview').textContent=overview?'CERRAR ÍNDICE':'ÍNDICE · 60'}

document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key.toLowerCase()==='i'){toggleOverview();return}if(e.key==='Escape'&&overview){toggleOverview(false);return}if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();return}if(overview)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});

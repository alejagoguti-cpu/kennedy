rder-bottom:2px solid var(--pink)}.hint{font-size:11px;color:#b9c6c1}.overview{position:fixed;inset:58px 0 68px;z-index:9;background:#f7f5ef;overflow:auto;padding:32px 5vw;display:none}.overview.open{display:block}.overview h2{font:700 46px "Space Grotesk";letter-spacing:-.05em}.overview-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.overview-grid button{border:1px solid #b8c1b8;background:white;padding:15px;text-align:left;cursor:pointer;min-height:115px}.overview-grid button:hover{background:var(--yellow)}.overview-grid small{display:block;color:var(--red);font-weight:700;margin-bottom:12px}.overview-grid strong{font-size:14px}.slide.end{background:var(--ink);color:white}.slide.end .visual{background:var(--red)!important}.slide.end .visual svg{filter:brightness(0) invert(1)}@media(max-width:800px){.app{grid-template-rows:54px minmax(0,1fr) 62px}.slide,.slide.cover,.slide.statement,.slide.index{grid-template-columns:1fr;grid-template-rows:60% 40%}.slide .copy{padding:25px 7vw 14px}.slide .copy h1,.slide.cover .copy h1,.slide.statement .copy h1{font-size:clamp(39px,10vw,74px);margin:12px 0}.slide .copy p{font-size:14px}.slide .visual{border-left:0;border-top:1px solid #232b2920}.slide .visual svg{width:min(65%,350px);max-height:85%}.chapters,.hint{display:none}.progress{bottom:62px}.overview{inset:54px 0 62px}.overview-grid{grid-template-columns:repeat(2,1fr)}.top .eyebrow{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div class="app"><header class="top"><div class="brand">KENNEDY<b>.</b> / EN RED</div><div class="right"><span class="eyebrow">Federación policéntrica · Presentación de proyecto</span><a href="kennedy-version-anterior.html">Ver web anterior</a><button id="openOverview" style="background:none;border:1px solid #303936;padding:9px 12px;cursor:pointer;font-size:11px;font-weight:700">ÍNDICE · 60</button></div></header><main class="viewport" id="viewport" aria-label="Presentación interactiva de 60 diapositivas"></main><div class="progress" id="progress"></div><footer class="footer"><div class="chapters" id="chapters"></div><div class="controls"><button id="prev" aria-label="Anterior">←</button><span class="counter" id="counter">01 / 60</span><button id="next" aria-label="Siguiente">→</button></div><div class="hint">← → NAVEGAR · I ÍNDICE · F PANTALLA COMPLETA</div></footer></div><div class="overview" id="overview"><h2>Índice de la presentación</h2><div class="overview-grid" id="overviewGrid"></div></div><script>
const slides=[{"group":"APERTURA","title":"Kennedy en red.","body":"Una federación policéntrica para transformar las relaciones entre alimento, agua, movilidad y comunidad.","type":"cover"},{"group":"APERTURA","title":"Una pregunta territorial.","body":"¿Cómo distribuir la capacidad de decidir sin crear otro centro obligatorio?","type":"statement"},{"group":"APERTURA","title":"Índice.","body":"01 Territorio · 02 Diagnóstico · 03 Visión · 04 Sostenimiento · 05 Estructuras · 06 Arquitectura · 07 Simulación","type":"index"},{"group":"APERTURA","title":"Quiénes somos.","body":"Equipo de investigación y diseño territorial. Arquitectura, lectura socioecológica y modelamiento como herramientas para formular hipótesis verificables.","type":"people"},{"group":"APERTURA","title":"Nuestra postura.","body":"No diseñamos un objeto aislado. Diseñamos condiciones espaciales para acuerdos, intercambios y cuidado.","type":"statement"},{"group":"APERTURA","title":"Cómo leer esta propuesta.","body":"Hechos documentados, inferencias territoriales y decisiones proyectuales se presentan como capas diferentes.","type":"three"},{"group":"TERRITORIO","title":"Kennedy no es una isla.","body":"El abastecimiento, los humedales y las rutas de movilidad conectan el barrio con sistemas metropolitanos.","type":"map"},{"group":"TERRITORIO","title":"El territorio cotidiano.","body":"Una compra, un desplazamiento y una lluvia hacen visibles redes que normalmente no aparecen juntas.","type":"three"},{"group":"TERRITORIO","title":"Alimentos.","body":"Productores, transportadores, comerciantes y hogares forman una cadena con capacidades desiguales para decidir.","type":"flow"},{"group":"TERRITORIO","title":"Agua.","body":"El Burro, La Vaca y Techo no son vacíos: forman parte de una red ecológica presionada por la urbanización.","type":"map"},{"group":"TERRITORIO","title":"Movilidad.","body":"Banderas, las Américas y la avenida Ciudad de Cali concentran transferencias y desplazamientos.","type":"flow"},{"group":"TERRITORIO","title":"Espacio público.","body":"Circulación, comercio, encuentro y permanencia compiten por superficies limitadas.","type":"three"},{"group":"TERRITORIO","title":"Cuatro presiones.","body":"Abastecimiento · movilidad · agua y hábitat · espacio público.","type":"four"},{"group":"TERRITORIO","title":"Una concentración visible.","body":"Corabastos es una infraestructura esencial del abastecimiento. La propuesta no busca sustituirla.","type":"statement"},{"group":"TERRITORIO","title":"La pregunta no es cerrar.","body":"La pregunta es qué circuitos complementarios pueden ampliar opciones sin desconocer las redes existentes.","type":"flow"},{"group":"TERRITORIO","title":"Del síntoma a la relación.","body":"Una presión no se explica por una sola causa. La lectura conecta actores, recursos y decisiones.","type":"network"},{"group":"TERRITORIO","title":"Lo que sabemos.","body":"Existen infraestructuras, organizaciones y conflictos territoriales identificables.","type":"three"},{"group":"TERRITORIO","title":"Lo que debemos verificar.","body":"Intensidad de relaciones, acuerdos vigentes, datos temporales y capacidades reales de operación.","type":"three"},{"group":"VISIÓN","title":"Overview.","body":"Federación policéntrica: varios nodos con autonomía relativa y reglas de cooperación.","type":"cover"},{"group":"VISIÓN","title":"De un centro a una red.","body":"La federación agrega posibilidades de intercambio; no reemplaza el sistema de abastecimiento existente.","type":"network"},{"group":"VISIÓN","title":"¿Qué es un nodo?","body":"Un lugar, actor o infraestructura capaz de recibir, transformar o distribuir recursos y decisiones.","type":"three"},{"group":"VISIÓN","title":"¿Qué es un vínculo?","body":"Un acuerdo verificable de intercambio, cuidado, información o corresponsabilidad.","type":"flow"},{"group":"VISIÓN","title":"Qué no es la federación.","body":"No es un edificio único, una plataforma obligatoria ni una red sin responsables.","type":"statement"},{"group":"VISIÓN","title":"Una hipótesis espacial.","body":"Espacios pequeños y conectados pueden fortalecer circuitos territoriales complementarios.","type":"map"},{"group":"VISIÓN","title":"Quién interviene.","body":"Hogares, comerciantes, productores, colegios, organizaciones comunitarias e instituciones.","type":"people"},{"group":"VISIÓN","title":"Cómo se construye.","body":"Convocar → escuchar → mapear → acordar → prototipar → simular → diseñar → construir.","type":"timeline"},{"group":"VISIÓN","title":"Qué produce.","body":"Acuerdos, rutas alternativas, espacios de encuentro y mecanismos de seguimiento.","type":"four"},{"group":"SOSTENIMIENTO","title":"Más allá de la inauguración.","body":"La permanencia depende de operación, mantenimiento, recursos y capacidad de adaptación.","type":"cover"},{"group":"SOSTENIMIENTO","title":"Gobernanza distribuida.","body":"Cada nodo necesita responsabilidades explícitas y mecanismos para resolver desacuerdos.","type":"network"},{"group":"SOSTENIMIENTO","title":"Quién convoca.","body":"La convocatoria es una tarea concreta: identificar participantes, canales y tiempos.","type":"people"},{"group":"SOSTENIMIENTO","title":"Quién decide.","body":"Las decisiones requieren criterios, representación y registro de acuerdos.","type":"three"},{"group":"SOSTENIMIENTO","title":"Quién opera.","body":"La operación cotidiana debe distinguirse de la participación ocasional.","type":"three"},{"group":"SOSTENIMIENTO","title":"Quién mantiene.","body":"Limpieza, reparación, reposición y cuidado ecológico necesitan responsables y recursos.","type":"four"},{"group":"SOSTENIMIENTO","title":"De dónde salen los recursos.","body":"Explorar aportes institucionales, economías de intercambio y acuerdos locales; aún sin presupuesto validado.","type":"flow"},{"group":"SOSTENIMIENTO","title":"Cómo se distribuyen.","body":"Evitar que una sola organización concentre recursos y capacidad de veto.","type":"network"},{"group":"SOSTENIMIENTO","title":"Cómo se aprende.","body":"Registrar fallas, ajustar reglas y transferir conocimiento entre nodos.","type":"timeline"},{"group":"SOSTENIMIENTO","title":"Si un nodo falla.","body":"La red debe contar con rutas complementarias y protocolos de contingencia.","type":"network"},{"group":"SOSTENIMIENTO","title":"Si cambia el territorio.","body":"Los espacios y acuerdos deben poder adaptarse a nuevas demandas y límites ecológicos.","type":"map"},{"group":"SOSTENIMIENTO","title":"Indicadores para revisar.","body":"Participación efectiva · continuidad operativa · flujos · recuperación · efectos ambientales.","type":"four"},{"group":"SOSTENIMIENTO","title":"Una condición de viabilidad.","body":"Sin acuerdos verificables y recursos de mantenimiento, la federación sigue siendo una hipótesis.","type":"statement"},{"group":"CUATRO ESTRUCTURAS","title":"Cuatro estructuras.","body":"Producción · distribución · consumo · recuperación de recursos.","type":"cover"},{"group":"CUATRO ESTRUCTURAS","title":"01 / Producción.","body":"Articular capacidades locales de cultivo, aprendizaje y abastecimiento complementario.","type":"structure"},{"group":"CUATRO ESTRUCTURAS","title":"Producir no es solo cultivar.","body":"Requiere suelo, agua, conocimiento, calendario, coordinación y cuidado.","type":"flow"},{"group":"CUATRO ESTRUCTURAS","title":"Dónde podría ocurrir.","body":"Huertas escolares y comunitarias: ubicaciones por validar con actores y condiciones del lugar.","type":"map"},{"group":"CUATRO ESTRUCTURAS","title":"02 / Distribución.","body":"Conectar productores, puntos de intercambio y necesidades de proximidad.","type":"structure"},{"group":"CUATRO ESTRUCTURAS","title":"Mover sin reconcentrar.","body":"Las rutas y horarios deben responder a capacidades reales y no crear otro cuello de botella.","type":"flow"},{"group":"CUATRO ESTRUCTURAS","title":"Puntos de intercambio.","body":"Espacios ligeros para recibir, clasificar y redistribuir; sin imponer un nodo central.","type":"map"},{"group":"CUATRO ESTRUCTURAS","title":"03 / Consumo.","body":"Vincular hogares, comedores, escuelas y comercio de barrio con circuitos de acceso.","type":"structure"},{"group":"CUATRO ESTRUCTURAS","title":"Consumir también decide.","body":"La demanda, los hábitos y los acuerdos de compra modifican el funcionamiento de la red.","type":"flow"},{"group":"CUATRO ESTRUCTURAS","title":"Aprender en común.","body":"La educación alimentaria puede vincular conocimiento, preparación y decisiones colectivas.","type":"people"},{"group":"CUATRO ESTRUCTURAS","title":"04 / Recuperación.","body":"Convertir pérdidas y residuos orgánicos en flujos de aprovechamiento donde sea viable.","type":"structure"},{"group":"CUATRO ESTRUCTURAS","title":"Del residuo al recurso.","body":"Separación → recolección → tratamiento adecuado → posible retorno al sistema.","type":"flow"},{"group":"CUATRO ESTRUCTURAS","title":"Límites ambientales.","body":"La recuperación requiere condiciones sanitarias, operación responsable y revisión técnica.","type":"statement"},{"group":"CUATRO ESTRUCTURAS","title":"Las cuatro se conectan.","body":"Ninguna estructura funciona de forma aislada: materiales, decisiones y cuidados circulan.","type":"network"},{"group":"ARQUITECTURA Y SIMULACIÓN","title":"Arquitectura como interfaz.","body":"Cinco espacios posibles articulan actores, flujos y decisiones territoriales.","type":"cover"},{"group":"ARQUITECTURA Y SIMULACIÓN","title":"E01 / Intercambio barrial.","body":"Recepción, encuentro y circulación de productos a escala de proximidad.","type":"structure"},{"group":"ARQUITECTURA Y SIMULACIÓN","title":"E02 / Aula alimentaria.","body":"Aprendizaje, preparación y experimentación con prácticas de alimentación.","type":"structure"},{"group":"ARQUITECTURA Y SIMULACIÓN","title":"E03 / Recuperación orgánica.","body":"Infraestructura para clasificación y aprovechamiento, sujeta a viabilidad técnica.","type":"structure"},{"group":"ARQUITECTURA Y SIMULACIÓN","title":"E04 / Asamblea.","body":"Espacio para deliberar, acordar, registrar y revisar decisiones.","type":"structure"},{"group":"ARQUITECTURA Y SIMULACIÓN","title":"E05 / Observación ecológica.","body":"Lugar para aprender del humedal sin tratarlo como superficie disponible para construir.","type":"structure"},{"group":"ARQUITECTURA Y SIMULACIÓN","title":"Simular antes de afirmar.","body":"Comparar escenarios ayuda a explorar efectos, no a demostrar automáticamente resultados.","type":"network"},{"group":"ARQUITECTURA Y SIMULACIÓN","title":"Cuatro escenarios.","body":"S0 base · S1 circuitos barriales · S2 falla de abastecimiento · S3 restricciones ecológicas.","type":"four"},{"group":"ARQUITECTURA Y SIMULACIÓN","title":"Qué sigue.","body":"Contrastar actores, validar localizaciones, modelar flujos y definir responsabilidades.","type":"timeline"},{"group":"ARQUITECTURA Y SIMULACIÓN","title":"Kennedy en red.","body":"La forma sigue a las relaciones. La propuesta se sostiene cuando sus acuerdos también lo hacen.","type":"end"}];
const $=id=>document.getElementById(id);
const pal=['#a73e49','#2e5b60','#ad5c34','#425b47'];
function art(type,index){
const stroke=pal[index%4];const line=(x1,y1,x2,y2)=>'<path class="anim" d="M'+x1+' '+y1+'L'+x2+' '+y2+'" stroke="'+stroke+'" stroke-width="4" fill="none"/>';
const circ=(x,y,r,fill=stroke)=>'<circle class="pop" cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+fill+'"/>';
const rect=(x,y,w,h,fill=stroke)=>'<rect class="pop" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="4" fill="'+fill+'"/>';
let a='';
if(['network','map'].includes(type)){const pts=[[80,95],[260,55],[420,130],[120,300],[310,290],[475,350],[220,190]];const links=[[0,1],[1,2],[0,3],[3,4],[4,5],[1,6],[6,4],[6,2],[2,5]];a=links.map(([u,v])=>line(...pts[u],...pts[v])).join('')+pts.map((p,i)=>circ(p[0],p[1],i===6?33:20,i===6?'#f7f5ef':stroke)).join('')}
else if(type==='flow'||type==='timeline'){a=[0,1,2,3].map((_,i)=>rect(35+i*135,150+(i%2)*42,100,90,i%2?'#405e5c':stroke)).join('')+[0,1,2].map((_,i)=>line(135+i*135,195+(i%2)*42,170+i*135,195+((i+1)%2)*42)).join('')}
else if(type==='four'||type==='index'){a=[0,1,2,3].map((_,i)=>rect(45+(i%2)*240,40+Math.floor(i/2)*200,205,160,['#a73e49','#2e5b60','#e0a83c','#50684e'][i])).join('')}
else if(type==='people'){a=[0,1,2,3,4].map((_,i)=>circ(80+i*100,130+(i%2)*35,26)+rect(47+i*100,175+(i%2)*35,66,120)).join('')}
else if(type==='three'){a=[0,1,2].map((_,i)=>circ(110+i*175,210,70,['#a73e49','#2e5b60','#d18c49'][i])+line(180+i*175,210,215+i*175,210)).join('')}
else if(type==='structure'){a=rect(70,180,390,185,'#f7f5ef')+rect(120,120,280,75,stroke)+[0,1,2,3].map((_,i)=>rect(105+i*88,220,52,110,i%2?'#f4d887':'#b6c8dd')).join('')+line(50,370,480,370)}
else{a=circ(290,205,145,'#f7f5ef')+circ(290,205,98,stroke)+[0,1,2,3,4,5].map((_,i)=>{const t=i*Math.PI/3;return circ(290+205*Math.cos(t),205+180*Math.sin(t),14)}).join('')}
return '<svg viewBox="0 0 580 420" role="img" aria-label="Diagrama animado conceptual">'+a+'</svg>';
}
$('viewport').innerHTML=slides.map((s,i)=>'<section class="slide '+s.type+'" id="slide-'+(i+1)+'" aria-label="Diapositiva '+(i+1)+': '+s.title.replace(/"/g,'&quot;')+'"><div class="copy"><div class="eyebrow">'+s.group+' / FEDERACIÓN POLICÉNTRICA</div><div><h1>'+s.title+'</h1><p>'+s.body+'</p></div><div class="num">'+String(i+1).padStart(2,'0')+' / 60 &nbsp; KENNEDY · BOGOTÁ</div></div><div class="visual">'+art(s.type,i)+'</div></section>').join('');
let current=0,overview=false;
function go(i){current=Math.max(0,Math.min(slides.length-1,i));document.querySelectorAll('.slide').forEach((el,j)=>{el.classList.toggle('active',j===current);el.setAttribute('aria-hidden',j!==current)});$('counter').textContent=String(current+1).padStart(2,'0')+' / 60';$('progress').style.width=((current+1)/60*100)+'%';$('prev').disabled=current===0;$('next').disabled=current===59;document.querySelectorAll('.chapter-button').forEach(b=>b.classList.toggle('selected',b.dataset.group===slides[current].group));history.replaceState(null,'','#slide-'+(current+1))}
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);
const starts=[];slides.forEach((s,i)=>{if(!starts.some(x=>x.group===s.group))starts.push({group:s.group,i})});
$('chapters').innerHTML=starts.map(x=>'<button class="chapter-button" data-group="'+x.group+'" data-index="'+x.i+'">'+x.group+'</button>').join('');
document.querySelectorAll('.chapter-button').forEach(b=>b.onclick=()=>go(+b.dataset.index));
$('overviewGrid').innerHTML=slides.map((s,i)=>'<button data-i="'+i+'"><small>'+String(i+1).padStart(2,'0')+' · '+s.group+'</small><strong>'+s.title+'</strong></button>').join('');

function toggleOverview(force){overview=typeof force==='boolean'?force:!overview;$('overview').classList.toggle('open',overview);$('openOverview').textContent=overview?'CERRAR ÍNDICE':'ÍNDICE · 60'}
$('openOverview').onclick=()=>toggleOverview();
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key.toLowerCase()==='i'){toggleOverview();return}if(e.key==='Escape'&&overview){toggleOverview(false);return}if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();return}if(overview)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});
let sx=0;$('viewport').addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});$('viewport').addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-sx;if(Math.abs(dx)>70)go(current+(dx<0?1:-1))},{passive:true});
const hash=Number((location.hash.match(/slide-(\d+)/)||[])[1]);go(hash>0?hash-1:0);
